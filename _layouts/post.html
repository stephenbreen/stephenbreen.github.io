---
layout: default
---

<article class="post">
  <header class="wrap">
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </header>
  <div class="wrap content">
    {{ content }}
    <p class="more"><a href="/writing/">← all posts</a></p>
  </div>
</article>
